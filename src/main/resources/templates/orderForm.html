<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
    xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Taco Cloud</title>
        <link rel="stylesheet" th:href="@{/styles.css}"/>
    </head>
    <body><!-- @{/...} w znacznikach takich jak 'th:action' NIE OZNACZA ścieżki do zasobów statycznych, tylko jako punkt końcowy kontrolera -->
        <form th:object="${tacoOrder}" 
            method="POST"
            th:action="@{/orders}"
                > <!-- ,   dodajemy th:action bo domyślnie jesteśmy na '/orders/current' a przejdziemy na 'orders' bo tam odbieramy poprzez @PostMapping--> 
            <h1>Order your taco creations!</h1>

            <img th:src="@{/images/TacoCloud.png}" alt="PHOTO OF TACOCLOUD"/>
            <h2><a th:href="@{/design}">Design another taco</a></h2>
            <!-- list of all tacos -->
            <ul>
                <li th:each="taco : *{tacos}">
                    <span th:text="${taco.name}">name_of_taco</span>
                </li>
            </ul>

            <h3>Deliver my taco masterpieces to...</h3>
            <label for="deliveryName">Name: </label>
            <input type="text" th:field="*{deliveryName}"/><!-- podepnij pole do wlasciwosci deliveryName obiektu tacoOrder-->
            <span th:if="${#fields.hasErrors('deliveryName')}" th:errors="*{deliveryName}" class="validationError"></span><br/>
            <br/>

            <label for="deliveryStreet">Street address: </label>
            <input type="text" th:field="*{deliveryStreet}"/>
            <span th:if="${#fields.hasErrors('deliveryStreet')}" th:errors="*{deliveryStreet}" class="validationError"></span><br/>
            <br/>

            <label for="deliveryCity">City: </label>
            <input type="text" th:field="*{deliveryCity}"/>
            <span th:if="${#fields.hasErrors('deliveryCity')}" th:errors="*{deliveryCity}" class="validationError"></span><br/>
            <br/>

            <label for="deliveryState">State: </label>
            <input type="text" th:field="*{deliveryState}"/>
            <span th:if="${#fields.hasErrors('deliveryState')}" th:errors="*{deliveryState}" class="validationError"></span><br/>
            <br/>

            
            <label for="deliveryZip">Zip code: </label>
            <input type="text" th:field="*{deliveryZip}"/>
            <span th:if="${#fields.hasErrors('deliveryZip')}" th:errors="*{deliveryZip}" class="validationError"></span><br/>
            <br/>

            <h3>Here's how I'll pay...</h3>

            
            <label for="ccNumber">Credit Card #: </label>
            <input type="text" th:field="*{ccNumber}"/>
            <span th:if="${#fields.hasErrors('ccNumber')}" th:errors="*{ccNumber}" class="validationError"></span><br/>
            <br/>

            
            <label for="ccExpiration">Expiration: </label>
            <input type="text" th:field="*{ccExpiration}">
            <span th:if="${#fields.hasErrors('ccExpiration')}" th:errors="*{ccExpiration}" class="validationError"></span><br/>
            <br/>

            
            <label for="ccCVV">CVV: </label>
            <input type="text" th:field="*{ccCVV}">
            <span th:if="${#fields.hasErrors('ccCVV')}" th:errors="*{ccCVV}" class="validationError"></span><br/>
            <br/>

            <input type="submit" value="Submit">
        </form>
    </body>
</html>
